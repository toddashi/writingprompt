<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Prompt Generator</title>
   
    <!-- CSS: This section controls how the app looks -->
    <style>
        /* A classic, literary design with paper-like colors and serif fonts */
        body {
            background-color: #f9f7f1; /* Off-white, warm paper color */
            color: #2c2a29; /* Soft charcoal black for softer reading */
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* Subtle shadow */
            text-align: center;
            border: 1px solid #e3e0d8;
        }

        h1 {
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .controls {
            margin-bottom: 30px;
        }

        select {
            font-family: 'Georgia', serif;
            font-size: 1.1rem;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fdfcf9;
            color: #2c2a29;
            cursor: pointer;
            outline: none;
            margin-right: 10px;
            margin-bottom: 10px; /* For mobile wrapping */
        }

        button {
            font-family: 'Georgia', serif;
            font-size: 1.1rem;
            padding: 10px 20px;
            background-color: #3b4d45; /* Dark forest green */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #2c3a34;
        }

        /* The secondary button is hidden by default */
        #another-btn {
            display: none;
            background-color: #8c4a4a; /* Muted red to distinguish it */
        }

        #another-btn:hover {
            background-color: #6a3737;
        }

        #prompt-display {
            font-size: 1.5rem;
            line-height: 1.6;
            font-style: italic;
            min-height: 100px; /* Keeps the box from jumping too much */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a4a4a;
            border-top: 1px solid #e3e0d8;
            padding-top: 30px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Writing Prompt Generator</h1>
       
        <div class="controls">
            <!-- Dropdown for categories -->
            <select id="category-select">
                <option value="any">Any Category</option>
                <option value="poetry">Poetry</option>
                <option value="fiction">Fiction</option>
                <option value="nonfiction">Nonfiction</option>
            </select>

            <!-- Buttons -->
            <button id="generate-btn">Give Me a Prompt</button>
            <button id="another-btn">Another Prompt</button>
        </div>

        <!-- Where the text will appear -->
        <div id="prompt-display">
            Select a category and click the button to begin.
        </div>
    </div>

    <!-- JavaScript: This section controls how the app behaves -->
    <script>
        // 1. Where the prompts are stored
        const poetryPrompts = [
            "Write a poem about the smell of rain on dry earth.",
            "A poem starting with the phrase 'I forgot to tell you'.",
            "Describe a childhood memory using only colors, no names of objects.",
            "Write a short haiku about a forgotten cup of coffee.",
            "A poem told from the perspective of an old tree in a busy city.",
            "Write about a recurring dream in free verse.",
            "A poem focusing entirely on the feeling of cold hands.",
            "Write an ode to an everyday object you usually ignore.",
            "A poem where the last word of every line rhymes with 'light'.",
            "Describe the transition from autumn to winter in a sonnet."
        ];

        const fictionPrompts = [
            "A character discovers their reflection in the mirror is a second behind them.",
            "Write a story set in a library that only opens at midnight.",
            "A protagonist finds a key that unlocks any door, but there is a heavy cost.",
            "Two strangers are stuck in an elevator, and one claims to be from the future.",
            "A handwritten letter arrives 50 years late. What does it change?",
            "Write about a world where people can trade memories like currency.",
            "A detective investigates a crime where nothing was stolen, only cleaned.",
            "Write a scene about a road trip that takes an unexplained detour.",
            "A character adopts a stray pet that turns out to be mythical.",
            "Someone wakes up with a completely different voice."
        ];

        const nonfictionPrompts = [
            "Write about the most important lesson you learned from a total stranger.",
            "Describe a meal that changed your perspective on food or culture.",
            "An essay on your personal relationship with silence.",
            "Write about a time you failed miserably and what happened the day after.",
            "Describe a place you loved as a kid that no longer exists.",
            "Write a letter to your younger self about a specific, overcome fear.",
            "Reflect on the history of a seemingly mundane object you use every day.",
            "Write about a hobby you gave up and exactly why you stopped.",
            "Describe the distinct experience of getting lost in a new city.",
            "A personal reflection on what the concept of 'home' means to you."
        ];

        // 2. Grabbing the elements from the HTML so we can interact with them
        const categorySelect = document.getElementById("category-select");
        const generateBtn = document.getElementById("generate-btn");
        const anotherBtn = document.getElementById("another-btn");
        const promptDisplay = document.getElementById("prompt-display");

        // 3. The function that picks a random prompt
        function displayRandomPrompt() {
            const selectedCategory = categorySelect.value;
            let chosenArray = [];

            // Figure out which list to pull from based on the dropdown
            if (selectedCategory === "poetry") {
                chosenArray = poetryPrompts;
            } else if (selectedCategory === "fiction") {
                chosenArray = fictionPrompts;
            } else if (selectedCategory === "nonfiction") {
                chosenArray = nonfictionPrompts;
            } else if (selectedCategory === "any") {
                // Combine all arrays into one giant list
                chosenArray = poetryPrompts.concat(fictionPrompts, nonfictionPrompts);
            }

            // The Random Selection Math
            const randomIndex = Math.floor(Math.random() * chosenArray.length);
            const randomPrompt = chosenArray[randomIndex];

            // Display it on the screen
            promptDisplay.innerText = randomPrompt;

            // Hide the first button, show the "Another Prompt" button
            generateBtn.style.display = "none";
            anotherBtn.style.display = "inline-block";
        }

        // 4. Telling the buttons to run the function when clicked
        generateBtn.addEventListener("click", displayRandomPrompt);
        anotherBtn.addEventListener("click", displayRandomPrompt);

    </script>
</body>
</html>
